<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Apartment 103A — interactive editor</title>
<style>
:root{--bg:#f4f1ec;--ink:#2b2622;--mute:#8a8178;--line:#ddd6cc;--acc:#b0793f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#d9d4cc}
#gl{position:fixed;left:0;top:0;width:calc(100% - 300px);height:100%;touch-action:none;cursor:grab;display:block}
#gl.drag{cursor:grabbing}#gl.move{cursor:move}
#side{position:fixed;right:0;top:0;width:300px;height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column}
#side h1{font-size:15px;margin:0;padding:14px 16px 4px}
#side .sub{color:var(--mute);padding:0 16px 10px;font-size:12px;border-bottom:1px solid var(--line)}
#modes{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--ink)}
button:hover{border-color:#c4b9aa}button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.warn{color:#a33}
#props{padding:12px 16px;border-bottom:1px solid var(--line);display:none}
#props h2{font-size:14px;margin:0 0 2px}#props .room{color:var(--mute);font-size:12px;margin-bottom:10px}
.row{display:grid;grid-template-columns:62px 1fr 64px;gap:8px;align-items:center;margin:6px 0}
.row label{color:var(--mute)}
.row input[type=number]{width:64px;font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:6px;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#list{flex:1;overflow:auto;padding:6px 8px 12px}
#list .grp{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:10px 8px 4px}
#list .it{padding:4px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
#list .it:hover{background:#ebe5dc}#list .it.sel{background:var(--ink);color:#fff}
#list .it.hid{opacity:.45;text-decoration:line-through}
#list .it span{color:var(--mute);font-size:11px}#list .it.sel span{color:#ccc}
#foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
#help{position:fixed;left:12px;bottom:12px;background:#fffd;border-radius:8px;padding:7px 11px;font-size:12px;color:#544;max-width:calc(100% - 330px)}
.dim{position:fixed;transform:translate(-50%,-50%);background:var(--acc);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:9px;pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:calc(50% - 150px);top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
@media (max-width:700px){#gl{width:100%;height:58%}#side{top:58%;height:42%;width:100%;border-left:0;border-top:1px solid var(--line)}#help{display:none}#toast{left:50%}}
</style></head><body>
<canvas id="gl"></canvas>
<div id="side">
  <h1>Apartment 103A</h1>
  <div class="sub">Click any piece to select it. Change its size or position below, or drag it in the 3D view. A side that touches a wall or another piece stays put when you resize, and pieces can't be pushed into walls or each other.</div>
  <div id="modes">
    <button id="mOrbit" class="on">Overview</button><button id="mWalk">Walk inside</button>
    <button id="mCut">Cut walls</button><button id="mDims" class="on">Distances</button><button id="mOver">Allow overlap</button>
  </div>
  <div id="props">
    <h2 id="pName"></h2><div class="room" id="pRoom"></div>
    <div class="row"><label>Width</label><input type="range" id="rW"><input type="number" id="nW"></div>
    <div class="row"><label>Depth</label><input type="range" id="rD"><input type="number" id="nD"></div>
    <div class="row"><label>Height</label><input type="range" id="rH"><input type="number" id="nH"></div>
    <div class="row"><label>X</label><input type="range" id="rX"><input type="number" id="nX"></div>
    <div class="row"><label>Y</label><input type="range" id="rY"><input type="number" id="nY"></div>
    <div class="row"><label>Lift</label><input type="range" id="rZ"><input type="number" id="nZ"></div>
    <div class="row"><label>Rotate</label><input type="range" id="rR" min="0" max="359" step="1"><input type="number" id="nR"></div>
    <div class="btns">
      <button id="bRot">↻ 90°</button><button id="bDup">Duplicate</button><button id="bRes">Reset</button><button id="bDel" class="warn">Remove</button>
    </div>
  </div>
  <div id="list"></div>
  <div id="foot"><button id="bUndo">Undo</button><button id="bAll" class="warn">Reset all</button><button id="bExp">Export changes</button></div>
</div>
<div id="help"></div>
<div id="toast"></div>

function carryRiders(){if(sel<0||!RIDERS.length)return;const s=INST[sel],dx=s.x-RIDERS.ox,dy=s.y-RIDERS.oy;RIDERS.forEach(r=>{INST[r.j].x=r.x+dx;INST[r.j].y=r.y+dy})}
function blocker(i){if(allowOverlap||!BASEPEN)return null;const P=penalties(i);if(P.wall>BASEPEN.wall+0.5)return'a wall';
 for(const j in P.o){const b=BASEPEN.o[j]||0;if(P.o[j]>b+Math.max(b?30:4,b*.05))return INST[j].label}return null}
// ---------------------------------------------------------------- UI
const F={W:['rW','nW'],D:['rD','nD'],H:['rH','nH'],X:['rX','nX'],Y:['rY','nY'],Z:['rZ','nZ'],R:['rR','nR']};
function getV(s,k){const ob=OB[s.ob];return{W:ob.size[0]*s.sx,D:ob.size[1]*s.sy,H:ob.size[2]*s.sz,X:s.x,Y:s.y,Z:s.z,R:s.rot}[k]}
let TOUCH=null;const TOUCH_CM=3;
function shiftLocal(s,lx,ly,amt){const a=s.rot*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);s.x+=(c*lx-sn*ly)*amt;s.y+=(sn*lx+c*ly)*amt}
function setV(s,k,v){const ob=OB[s.ob];
 if(k==='W'||k==='D'){const T=TOUCH||sideDists(s);const ax=k==='W'?0:1,old=ob.size[ax]*(ax?s.sy:s.sx),nv=Math.max(1,v),dl=nv-old;
  if(ax===0)s.sx=nv/Math.max(ob.size[0],.1);else s.sy=nv/Math.max(ob.size[1],.1);
  const pos=ax?T.py<TOUCH_CM:T.px<TOUCH_CM,neg=ax?T.ny<TOUCH_CM:T.nx<TOUCH_CM;
  if(neg&&!pos)shiftLocal(s,ax?0:1,ax?1:0,dl/2);else if(pos&&!neg)shiftLocal(s,ax?0:1,ax?1:0,-dl/2);
  s.x=Math.round(s.x*10)/10;s.y=Math.round(s.y*10)/10;return}
 if(k==='H')s.sz=Math.max(1,v)/Math.max(ob.size[2],.1);if(k==='X')s.x=v;if(k==='Y')s.y=v;if(k==='Z')s.z=v;if(k==='R')s.rot=((v%360)+360)%360}
function fillProps(){const p=$('props');if(sel<0){p.style.display='none';return}p.style.display='block';const s=INST[sel],ob=OB[s.ob];
 $('pName').textContent=s.label;$('pRoom').textContent=ob.room+(s.hidden?' · removed':'');
 const sz=ob.size;const rng={W:[1,Math.max(400,sz[0]*3)],D:[1,Math.max(300,sz[1]*3)],H:[1,Math.max(270,sz[2]*2)],X:[-50,900],Y:[-50,1300],Z:[0,260],R:[0,359]};
 for(const k in F){const [r,n]=F[k].map($);r.min=rng[k][0];r.max=rng[k][1];r.step=1;const v=Math.round(getV(s,k));r.value=v;if(document.activeElement!==n)n.value=v}}
let pendingUndo=null;
for(const k in F){const [r,n]=F[k].map($);
 const on=v=>{if(sel<0||isNaN(v))return;if(!pendingUndo){pushUndo();pendingUndo=1;TOUCH=sideDists(INST[sel]);beginEdit()}
  const s=INST[sel],prev=Object.assign({},s),cur=getV(prev,k);setV(s,k,v);const who=blocker(sel);
  if(who){let lo=0,hi=1;for(let it=0;it<16;it++){const m=(lo+hi)/2;Object.assign(s,prev);setV(s,k,cur+(v-cur)*m);if(blocker(sel))hi=m;else lo=m}
   Object.assign(s,prev);setV(s,k,cur+(v-cur)*Math.min(1,lo+0.02));const who2=blocker(sel)||who;Object.assign(s,prev);setV(s,k,cur+(v-cur)*lo);toast('Stopped: it would run into '+who2);const nn=$(F[k][1]);nn.value=Math.round(getV(s,k))}
  if(k==='X'||k==='Y')carryRiders();commit(false)};
 r.addEventListener('input',()=>on(+r.value));n.addEventListener('input',()=>on(+n.value));
 r.addEventListener('change',()=>{pendingUndo=null;TOUCH=null});n.addEventListener('change',()=>{pendingUndo=null;TOUCH=null});n.addEventListener('blur',()=>{pendingUndo=null;TOUCH=null})}
const UNDO=[];function pushUndo(){UNDO.push(JSON.stringify(INST));if(UNDO.length>200)UNDO.shift()}
function commit(rebuild){save();fillProps();if(rebuild)buildList();else updList();dirty=true}
function select(i){sel=i;fillProps();updList();dirty=true;if(i>=0){const el=document.querySelector(`.it[data-i="${i}"]`);if(el)el.scrollIntoView({block:'nearest'})}}
function buildList(){const L=$('list');L.innerHTML='';const groups={};INST.forEach((s,i)=>{const ob=OB[s.ob];if(ob.fixed)return;(groups[ob.room]=groups[ob.room]||[]).push(i)});
 ['Kitchen','Living room','Bedroom 1','Bedroom 2'].filter(g=>groups[g]).concat(Object.keys(groups).filter(g=>!['Kitchen','Living room','Bedroom 1','Bedroom 2'].includes(g))).forEach(g=>{const h=document.createElement('div');h.className='grp';h.textContent=g;L.appendChild(h);
  groups[g].forEach(i=>{const s=INST[i],e=document.createElement('div');e.className='it';e.dataset.i=i;e.innerHTML=`<b style="font-weight:500">${s.label}</b><span></span>`;e.onclick=()=>select(i);L.appendChild(e)})});updList()}
function updList(){document.querySelectorAll('#list .it').forEach(e=>{const i=+e.dataset.i,s=INST[i];e.classList.toggle('sel',i===sel);e.classList.toggle('hid',s.hidden);
 e.querySelector('span').textContent=`${Math.round(getV(s,'W'))}×${Math.round(getV(s,'D'))}×${Math.round(getV(s,'H'))}`})}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1800)}
$('bRot').onclick=()=>{if(sel<0)return;beginEdit();const o=INST[sel].rot;INST[sel].rot=(o+90)%360;const w=blocker(sel);if(w){INST[sel].rot=o;return toast('Can\'t rotate here: it would overlap '+w)}INST[sel].rot=o;pushUndo();INST[sel].rot=(o+90)%360;commit()};
$('bDup').onclick=()=>{if(sel<0)return;pushUndo();const c=JSON.parse(JSON.stringify(INST[sel]));c.hidden=false;c.label=INST[sel].label.replace(/ \(copy.*\)$/,'')+' (copy)';INST.push(c);const ci=INST.length-1;
 const bx=c.x,by=c.y;BASEPEN={wall:0,o:{}};let placed=allowOverlap;
 if(!allowOverlap){outer:for(let r=40;r<=400;r+=20)for(let k=0;k<16;k++){c.x=Math.round(bx+Math.cos(k/8*Math.PI)*r);c.y=Math.round(by+Math.sin(k/8*Math.PI)*r);if(!blocker(ci)){placed=true;break outer}}}
 if(!placed){c.x=bx+40;c.y=by+40;toast('No free spot nearby — the copy overlaps something')}commit(true);select(ci)};
$('bRes').onclick=()=>{if(sel<0)return;pushUndo();const b=baseState(OB[INST[sel].ob],INST[sel].ob);b.label=INST[sel].label;Object.assign(INST[sel],b,{label:INST[sel].label});commit()};
$('bDel').onclick=()=>{if(sel<0)return;pushUndo();INST[sel].hidden=!INST[sel].hidden;commit();toast(INST[sel].hidden?'Removed — click it in the list to bring it back':'Restored')};
$('bUndo').onclick=undo;function undo(){if(!UNDO.length)return toast('Nothing to undo');INST=JSON.parse(UNDO.pop());if(sel>=INST.length)sel=-1;commit(true);fillProps()}
$('bAll').onclick=()=>{if(!confirmReset())return;pushUndo();INST=freshInst();sel=-1;commit(true)};
function confirmReset(){const b=$('bAll');if(b.dataset.armed){delete b.dataset.armed;b.textContent='Reset all';return true}b.dataset.armed=1;b.textContent='Click again to reset';setTimeout(()=>{delete b.dataset.armed;b.textContent='Reset all'},2500);return false}
$('bExp').onclick=()=>{const ch=[];INST.forEach((s,i)=>{const ob=OB[s.ob];if(ob.fixed)return;const b=baseState(ob,s.ob);const same=i<OB.length&&['x','y','z','sx','sy','sz','rot','hidden'].every(k=>Math.abs((+s[k])-(+b[k]))<1e-3)&&s.label===b.label;if(same)return;
 ch.push({piece:s.label,original:ob.name,width_cm:Math.round(getV(s,'W')),depth_cm:Math.round(getV(s,'D')),height_cm:Math.round(getV(s,'H')),centre_x_cm:Math.round(s.x),centre_y_cm:Math.round(s.y),lift_cm:Math.round(s.z),rotation_deg:Math.round(s.rot),removed:s.hidden,added_copy:i>=OB.length})});
 const txt=JSON.stringify({apartment:'103A',changes:ch},null,1);try{navigator.clipboard.writeText(txt).then(()=>toast('Changes copied — paste them to Claude'),()=>{})}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='Apartment_103A_changes.json';a.click();if(!ch.length)toast('No changes yet')};
function setMode(m){mode=m;$('mOrbit').classList.toggle('on',m==='orbit');$('mWalk').classList.toggle('on',m==='walk');$('mCut').style.display=m==='orbit'?'':'none';
 $('help').innerHTML=m==='orbit'?'<b>Overview</b> · drag: rotate · right-drag or Shift-drag: pan · scroll: zoom · click a piece to select · drag a selected piece to move it · arrows: nudge 1 cm (Shift 10) · R: rotate · Del: remove · Ctrl+Z: undo'
 :'<b>Walk inside</b> · W/A/S/D or arrow keys: walk · drag: look around · click a piece to select it · drag a selected piece to move it';dirty=true}
$('mOrbit').onclick=()=>setMode('orbit');$('mWalk').onclick=()=>{placeWalker();setMode('walk')};
function inRoom(x,y){return D.rooms.some(P=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c})}
function clearPath(a,b){const d=[b[0]-a[0],b[1]-a[1]],L=Math.hypot(...d);const u=[d[0]/L,d[1]/L];return !WALLSEG.some(([p,q])=>{const t=segHit(a,u,p,q);return t!==null&&t<L})}
function placeWalker(){let tgt=[250,300];if(sel>=0)tgt=[INST[sel].x,INST[sel].y];let best=null;
 for(const dist of [230,180,140,280,330])for(let k=0;k<16;k++){const a=k/16*Math.PI*2,p=[tgt[0]+Math.cos(a)*dist,tgt[1]+Math.sin(a)*dist];
  if(inRoom(p[0],p[1])&&(sel<0||clearPath(p,tgt))){best=p;break}if(best)break}
 if(sel<0||!best){best=best||[250,300];if(sel<0){cam.ex=180;cam.ey=330;cam.wy=-0.6;cam.wp=-.05;return}}
 cam.ex=best[0];cam.ey=best[1];cam.wy=Math.atan2(tgt[1]-best[1],tgt[0]-best[0]);cam.wp=-.18}
$('mCut').onclick=()=>{cut=cut?0:120;$('mCut').classList.toggle('on',!!cut);dirty=true};
$('mOver').onclick=()=>{allowOverlap=!allowOverlap;$('mOver').classList.toggle('on',allowOverlap);toast(allowOverlap?'Pieces can now overlap':'Pieces can no longer overlap')};
$('mDims').onclick=()=>{showDims=!showDims;$('mDims').classList.toggle('on',showDims);dirty=true};
// ---------------------------------------------------------------- input
let drag=null;
function planeHit(px,py,z){const d=rayAt(px,py);if(Math.abs(d[2])<1e-4)return null;const t=(z-EYE[2])/d[2];if(t<0)return null;return[EYE[0]+d[0]*t,EYE[1]+d[1]*t]}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;setupCam();
 const hit=pick(px,py);drag={x:e.clientX,y:e.clientY,px,py,moved:false,hit,btn:e.button,shift:e.shiftKey};
 if(hit>=0&&hit===sel&&e.button===0){const s=INST[sel];const h=planeHit(px,py,s.z);if(h){drag.move={ox:s.x-h[0],oy:s.y-h[1]};beginEdit();cv.classList.add('move')}}
 else cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved&&Math.hypot(e.clientX-(drag.sx??(drag.sx=drag.x)),e.clientY-(drag.sy??(drag.sy=drag.y)))<4)return;
 if(!drag.moved&&drag.move)pushUndo();drag.moved=true;const r=cv.getBoundingClientRect();
 if(drag.move){const s=INST[sel],h=planeHit(e.clientX-r.left,e.clientY-r.top,s.z);if(h){const nx=Math.round(h[0]+drag.move.ox),ny=Math.round(h[1]+drag.move.oy),ox=s.x,oy=s.y;let ok=false;
   for(const [tx,ty] of [[nx,ny],[nx,oy],[ox,ny]]){s.x=tx;s.y=ty;if(!blocker(sel)){ok=true;break}}
   if(!ok){s.x=ox;s.y=oy;if(!drag.warned){drag.warned=1;toast('Blocked by '+(blocker((s.x=nx,s.y=ny,sel))||'another piece'));s.x=ox;s.y=oy}}
   carryRiders();fillProps();updList();dirty=true}}
 else if(mode==='orbit'){if(drag.btn===2||drag.shift){const k=cam.dist/900,rx=-Math.sin(cam.yaw),ry=Math.cos(cam.yaw),fx=-Math.cos(cam.yaw),fy=-Math.sin(cam.yaw);
   cam.tx+=-rx*dx*k+fx*dy*k;cam.ty+=-ry*dx*k+fy*dy*k}
  else{cam.yaw-=dx*.006;cam.pitch=Math.max(.08,Math.min(1.55,cam.pitch+dy*.006))}}
 else{cam.wy-=dx*.005;cam.wp=Math.max(-1.3,Math.min(1.3,cam.wp-dy*.005))}
 drag.x=e.clientX;drag.y=e.clientY;dirty=true});
cv.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&drag.btn===0){select(drag.hit)}if(drag&&drag.move&&drag.moved)commit();drag=null;cv.classList.remove('drag','move')});
cv.addEventListener('wheel',e=>{e.preventDefault();if(mode==='orbit'){cam.dist=Math.max(150,Math.min(4000,cam.dist*Math.exp(e.deltaY*.0012)))}else{const k=-e.deltaY*.3;cam.ex+=Math.cos(cam.wy)*k;cam.ey+=Math.sin(cam.wy)*k}dirty=true},{passive:false});
const keys={};addEventListener('keydown',e=>{if(/INPUT/.test(document.activeElement.tagName))return;keys[e.key.toLowerCase()]=1;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
 if(sel>=0&&mode==='orbit'&&['arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase())){e.preventDefault();const st=e.shiftKey?10:1;pushUndo();const s=INST[sel];
  const k=e.key.toLowerCase();const rx=-Math.sin(cam.yaw),ry=Math.cos(cam.yaw);let fx=-Math.cos(cam.yaw),fy=-Math.sin(cam.yaw);
  let mx=0,my=0;if(k==='arrowright'){mx=rx;my=ry}if(k==='arrowleft'){mx=-rx;my=-ry}if(k==='arrowup'){mx=fx;my=fy}if(k==='arrowdown'){mx=-fx;my=-fy}
  beginEdit();const ox=s.x,oy=s.y;if(Math.abs(mx)>Math.abs(my)){s.x+=Math.sign(mx)*st}else{s.y+=Math.sign(my)*st}const w=blocker(sel);if(w){s.x=ox;s.y=oy;UNDO.pop();toast('Blocked by '+w)}carryRiders();commit();return}
 if(sel>=0&&e.key.toLowerCase()==='r'&&mode==='orbit'){$('bRot').click()}
 if(sel>=0&&(e.key==='Delete'||e.key==='Backspace')){$('bDel').click()}
 if(e.key==='Escape')select(-1)});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 if(mode==='walk'){let f=0,s=0;if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;if(keys.a||keys.arrowleft)s-=1;if(keys.d||keys.arrowright)s+=1;
  if(f||s){const sp=170*dt;cam.ex+=(Math.cos(cam.wy)*f+Math.sin(cam.wy)*s)*sp;cam.ey+=(Math.sin(cam.wy)*f-Math.cos(cam.wy)*s)*sp;dirty=true}}

addEventListener('resize',()=>dirty=true);
